services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:  # secrets only; settings come from app/config.py
      - path: .env
        required: false
    volumes:
      # chroma_persist_dir defaults to ./chroma_data, i.e. /srv/chroma_data in the container.
      - chroma_data:/srv/chroma_data
      # Downloaded models (~2.4 GB) survive container rebuilds.
      - model_cache:/root/.cache
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s  # first start downloads the models

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  chroma_data:
  model_cache:
