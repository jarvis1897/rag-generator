# Eval set over eval/sample_docs (a fictional company, so the model can't answer from memory).
#
# Fields:
#   question         the user question
#   answerable       false for questions the documents cannot answer (refusal expected)
#   expected_source  filename that should appear in the retrieved top-k
#   expected_page    optional page that should appear for that file
#   must_include     optional strings the answer should contain (case-insensitive)

questions:
  - question: How many days do I have to return unused items?
    answerable: true
    expected_source: returns_policy.md
    must_include: ["45"]

  - question: What does return shipping cost if I'm not a loyalty member?
    answerable: true
    expected_source: returns_policy.md
    must_include: ["8.50"]

  - question: How long is the warranty on Halcyon tents?
    answerable: true
    expected_source: returns_policy.md
    must_include: ["10"]

  - question: Can I return an opened fuel canister?
    answerable: true
    expected_source: returns_policy.md

  - question: How much does the Stratus 2 tent weigh?
    answerable: true
    expected_source: product_specs.txt
    must_include: ["1.18"]

  - question: What is the comfort rating of the Nimbus 15 sleeping bag?
    answerable: true
    expected_source: product_specs.txt
    must_include: ["-4"]

  - question: Which torso sizes does the Cirrus 55 come in?
    answerable: true
    expected_source: product_specs.txt
    must_include: ["small", "medium", "large"]

  - question: How fast does the Ember stove boil a litre of water?
    answerable: true
    expected_source: product_specs.txt
    must_include: ["3 minutes"]

  - question: How many days of paid time off do full-time employees get per year?
    answerable: true
    expected_source: employee_handbook.pdf
    expected_page: 3
    must_include: ["21"]

  - question: When does the 401(k) match start for new hires?
    answerable: true
    expected_source: employee_handbook.pdf
    expected_page: 4
    must_include: ["90"]

  - question: Can retail store staff work remotely?
    answerable: true
    expected_source: employee_handbook.pdf
    expected_page: 2

  - question: Who founded Halcyon and where?
    answerable: true
    expected_source: employee_handbook.pdf
    expected_page: 1
    must_include: ["Okafor"]

  # Deliberately unanswerable: the documents don't cover these.
  - question: What is the CEO's annual salary?
    answerable: false

  - question: Does Halcyon ship to Canada, and how long does it take?
    answerable: false

  - question: What is the boiling point of water at the summit of Everest?
    answerable: false
